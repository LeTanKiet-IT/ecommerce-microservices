services:
  # ============================================
  # DATABASE: AUTH
  # ============================================
  auth-db:
    image: postgres:16-alpine
    container_name: ecommerce-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
  # ============================================
  # REDIS
  # ============================================
  gateway-redis:
    image: redis:7-alpine
    container_name: ecommerce-gateway-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - gateway-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 10
  # ============================================
  # MONGODB REPLICA SET
  # ============================================
  product-db:
    image: mongo:7
    container_name: ecommerce-product-db
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /keys/keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: product_db
    ports:
      - "127.0.0.1:${PRODUCT_DB_PORT}:27017"
    volumes:
      - product-db-data:/data/db
      - ecommerce-mongo-key:/keys:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping: 1})"'
      interval: 5s
      timeout: 5s
      retries: 10
  # ============================================
  # DATABASE: CUSTOMER
  # ============================================
  customer-db:
    image: postgres:16-alpine
    container_name: ecommerce-customer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME}
      POSTGRES_USER: ${CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports:
      - "127.0.0.1:${CUSTOMER_DB_PORT}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
  # ============================================
  # DATABASE: ORDER
  # ============================================
  order-db:
    image: postgres:16-alpine
    container_name: ecommerce-order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "127.0.0.1:${ORDER_DB_PORT}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
  # ============================================
  # DATABASE: SHIPMENT
  # ============================================
  shipment-db:
    image: postgres:16-alpine
    container_name: ecommerce-shipment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHIPMENT_DB_NAME}
      POSTGRES_USER: ${SHIPMENT_DB_USER}
      POSTGRES_PASSWORD: ${SHIPMENT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${SHIPMENT_DB_PORT}:5432"
    volumes:
      - shipment-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
  # ============================================
  # APACHE KAFKA - KRaft
  # ============================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: ecommerce-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
  # ============================================
  # AUTH SERVICE
  # ============================================
  auth-service:
    image: ecommerce-auth-service:local
    container_name: ecommerce-auth-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      AUTH_DB_URL: "postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}"
      PORT: "3001"
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3001/health/ready", {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # ============================================
  # CUSTOMER SERVICE
  # ============================================
  customer-service:
    image: ecommerce-customer-service:local
    container_name: ecommerce-customer-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      CUSTOMER_DB_HOST: customer-db
      CUSTOMER_DB_PORT: "5432"
      CUSTOMER_SERVICE_PORT: "3002"
    depends_on:
      customer-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3002/health/ready", {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # ============================================
  # PRODUCT SERVICE
  # ============================================
  product-service:
    image: ecommerce-product-service:local
    container_name: ecommerce-product-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PRODUCT_MONGO_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@product-db:27017/product_db?authSource=admin&replicaSet=rs0"
      PRODUCT_SERVICE_PORT: "3003"
    depends_on:
      product-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3003/health/ready", {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # ============================================
  # ORDER SERVICE
  # ============================================
  order-service:
    image: ecommerce-order-service:local
    container_name: ecommerce-order-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: "5432"
      ORDER_SERVICE_PORT: "3004"
      CUSTOMER_SERVICE_BASE_URL: http://customer-service:3002
      PRODUCT_SERVICE_BASE_URL: http://product-service:3003
      PRODUCT_SERVICE_URL: http://product-service:3003
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
    ports:
      - "127.0.0.1:3004:3004"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3004/health/ready", {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # ============================================
  # SHIPMENT SERVICE
  # ============================================
  shipment-service:
    image: ecommerce-shipment-service:local
    container_name: ecommerce-shipment-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SHIPMENT_DB_HOST: shipment-db
      SHIPMENT_DB_PORT: "5432"
      SHIPMENT_SERVICE_PORT: "3005"
    depends_on:
      shipment-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3005"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3005/health/ready", {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # ============================================
  # API GATEWAY
  # ============================================
  api-gateway:
    image: ecommerce-api-gateway:local
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      API_GATEWAY_PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3001/api/auth
      AUTH_SERVICE_HEALTH_URL: http://auth-service:3001/health/ready
      ORDER_SERVICE_URL: http://order-service:3004
      SHIPMENT_SERVICE_URL: http://shipment-service:3005
      REDIS_URL: "redis://:${REDIS_PASSWORD}@gateway-redis:6379"
    depends_on:
      gateway-redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      shipment-service:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/api/health", {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # ============================================
  # ORDER OUTBOX PUBLISHER
  # ============================================
  order-outbox-publisher:
    image: ecommerce-order-service:local
    container_name: ecommerce-order-outbox-publisher
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
    command:
      - node
      - src/infrastructure/messaging/outbox.publisher.js
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_started
  # ============================================
  # SHIPMENT KAFKA CONSUMER
  # ============================================
  shipment-consumer:
    image: ecommerce-shipment-service:local
    container_name: ecommerce-shipment-consumer
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SHIPMENT_DB_HOST: shipment-db
      SHIPMENT_DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
    command:
      - node
      - src/infrastructure/messaging/shipment.consumer.js
    depends_on:
      shipment-db:
        condition: service_healthy
      kafka:
        condition: service_started
# ================================================
# PERSISTENT VOLUMES
# ================================================
volumes:
  auth-db-data:
  gateway-redis-data:
  product-db-data:
  customer-db-data:
  order-db-data:
  kafka-data:
  shipment-db-data:
  ecommerce-mongo-key:
    external: true
