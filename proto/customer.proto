syntax = "proto3";

package ecommerce.customer.v1;

// Contract proposal only: current Customer Service exposes REST, not gRPC.
service CustomerService {
  rpc GetCustomer(GetCustomerRequest) returns (CustomerProfile);
  rpc GetMembershipByScore(GetMembershipByScoreRequest) returns (MembershipResult);
}

message GetCustomerRequest {
  int64 auth_user_id = 1;
}

message CustomerProfile {
  int64 auth_user_id = 1;
  string full_name = 2;
  string address = 3;
  int64 score = 4;
  string membership_tier = 5;
  double discount_percent = 6;
}

message GetMembershipByScoreRequest {
  int64 score = 1;
}

message MembershipTier {
  string tier_name = 1;
  int64 min_score = 2;
  double discount_percent = 3;
}

message MembershipResult {
  int64 score = 1;
  MembershipTier tier = 2;
}
